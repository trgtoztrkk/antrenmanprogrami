<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="/manifest.webmanifest">
<title>Antrenman</title>
<style>
  :root {
    --bg: #F2F2F7;
    --surface: #FFFFFF;
    --surface-2: #E5E5EA;
    --surface-3: #D1D1D6;
    --separator: rgba(60, 60, 67, 0.12);
    --separator-strong: rgba(60, 60, 67, 0.24);
    --text: #000000;
    --text-2: #3C3C43;
    --text-3: #8E8E93;
    --accent: #007AFF;
    --accent-soft: rgba(0, 122, 255, 0.12);
    --success: #34C759;
    --success-soft: rgba(52, 199, 89, 0.12);
    --warning: #FF9500;
    --danger: #FF3B30;
    --focus: #FFCC00;
    --focus-soft: rgba(255, 204, 0, 0.15);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --radius-lg: 16px;
    --radius-md: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  [data-theme="dark"] {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --surface-3: #3A3A3C;
    --separator: rgba(255, 255, 255, 0.09);
    --separator-strong: rgba(255, 255, 255, 0.18);
    --text: #FFFFFF;
    --text-2: #EBEBF5;
    --text-3: #8E8E93;
    --accent: #0A84FF;
    --accent-soft: rgba(10, 132, 255, 0.18);
    --success: #30D158;
    --success-soft: rgba(48, 209, 88, 0.18);
    --warning: #FF9F0A;
    --danger: #FF453A;
    --focus: #FFD60A;
    --focus-soft: rgba(255, 214, 10, 0.18);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
    overscroll-behavior-y: none;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; }

  .onboard {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow-y: auto;
  }
  .onboard.show { display: flex; animation: fadeIn 0.35s ease; }
  .onboard-card { width: 100%; max-width: 360px; }
  .onboard-logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .onboard-logo svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .onboard-card h1 {
    margin: 0 0 0.5rem;
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.03em;
  }
  .onboard-card > p {
    margin: 0 0 2rem;
    font-size: 0.9rem;
    color: var(--text-3);
    line-height: 1.5;
    text-align: center;
  }
  .field { margin-bottom: 0.75rem; }
  .field label {
    display: block;
    font-size: 0.72rem;
    color: var(--text-3);
    font-weight: 500;
    margin-bottom: 0.4rem;
    padding-left: 0.15rem;
  }
  .field input {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
  .field-hint {
    font-size: 0.72rem;
    color: var(--text-3);
    margin-top: 0.4rem;
    padding-left: 0.15rem;
    line-height: 1.4;
  }
  .btn-primary {
    width: 100%;
    padding: 0.9rem;
    border-radius: var(--radius-md);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    margin-top: 1rem;
  }
  .btn-primary:active { opacity: 0.8; transform: scale(0.99); }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(var(--safe-top) + 0.75rem) 1rem 0.75rem;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--separator);
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .header-info { flex: 1; min-width: 0; }
  .header-name {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-sub {
    font-size: 0.78rem;
    color: var(--text-3);
    margin-top: 0.1rem;
    font-weight: 400;
  }
  .header-actions { display: flex; gap: 0.35rem; align-items: center; flex: 0 0 auto; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .icon-btn:active { background: var(--accent-soft); transform: scale(0.92); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .segmented-wrap { padding: 0.75rem 1rem 1rem; }
  .segmented {
    display: flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    flex: 1;
    padding: 0.5rem 0.35rem;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 0.76rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.01em;
  }
  .segmented button.active {
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  .view { display: none; padding: 0 1rem 5rem; }
  .view.active { display: block; animation: fadeUp 0.35s cubic-bezier(0.25, 0.1, 0.25, 1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.25rem 1rem;
    gap: 0.5rem;
  }
  .date-arrow {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface);
    border: none;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .date-arrow:active { background: var(--surface-2); transform: scale(0.92); }
  .date-arrow svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .date-center { flex: 1; text-align: center; min-width: 0; }
  .date-main {
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .date-sub {
    font-size: 0.75rem;
    color: var(--text-3);
    margin-top: 0.1rem;
    font-weight: 400;
  }
  .date-sub .today-action { color: var(--accent); font-weight: 500; }

  .session-block { margin-bottom: 1rem; }
  .btn-session {
    width: 100%;
    padding: 0.9rem;
    border-radius: var(--radius-md);
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-session:active { transform: scale(0.99); opacity: 0.9; }
  .btn-session.start { background: var(--accent); color: #fff; }
  .btn-session.end {
    background: var(--surface);
    color: var(--danger);
    border: 1px solid var(--separator);
  }
  .btn-session svg { width: 16px; height: 16px; fill: currentColor; }
  .btn-session.end svg { fill: none; stroke: currentColor; stroke-width: 2; }
  .session-running { display: flex; gap: 0.5rem; }
  .timer-display {
    flex: 0 0 auto;
    min-width: 100px;
    padding: 0.9rem 1rem;
    border-radius: var(--radius-md);
    background: var(--surface);
    border: 1px solid var(--separator);
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .session-done {
    padding: 0.9rem 1rem;
    border-radius: var(--radius-md);
    background: var(--success-soft);
    color: var(--success);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .meta-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  .meta-tile {
    flex: 1;
    padding: 0.75rem 1rem;
    background: var(--surface);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--separator);
  }
  .meta-tile svg { width: 16px; height: 16px; stroke: var(--text-3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .meta-tile label { font-size: 0.78rem; color: var(--text-3); font-weight: 500; }
  .meta-tile input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    text-align: right;
    padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .meta-tile input:focus { outline: none; }
  .meta-tile .unit { font-size: 0.75rem; color: var(--text-3); font-weight: 500; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 0.25rem 0.5rem;
  }
  .section-title {
    font-size: 0.75rem;
    color: var(--text-3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .section-count {
    font-size: 0.8rem;
    color: var(--text-3);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .section-count.done { color: var(--success); font-weight: 600; }

  .focus-card {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    padding: 0.75rem 1rem;
    background: var(--focus-soft);
    border-radius: var(--radius-md);
    margin-bottom: 1rem;
    font-size: 0.82rem;
    line-height: 1.45;
    color: var(--text-2);
  }
  .focus-card .star {
    flex: 0 0 auto;
    color: var(--focus);
    font-size: 1rem;
    line-height: 1.2;
    margin-top: 0.05rem;
  }
  .focus-card strong {
    color: var(--text);
    font-weight: 600;
    display: block;
    margin-bottom: 0.15rem;
    font-size: 0.82rem;
  }

  .ex-list {
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--separator);
  }
  .ex-row {
    padding: 1rem 1rem 0.9rem;
    border-bottom: 0.5px solid var(--separator);
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }
  .ex-row:last-child { border-bottom: none; }
  .ex-row.focus::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--focus);
  }
  .ex-row.focus.done::before { background: var(--success); }

  .ex-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.7rem;
  }
  .ex-name {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .ex-row.done .ex-name {
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-color: var(--text-3);
  }
  .focus-pill {
    display: inline-flex;
    align-items: center;
    padding: 0.12rem 0.45rem;
    border-radius: 100px;
    background: var(--focus-soft);
    color: var(--text);
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .ex-reps {
    font-size: 0.82rem;
    color: var(--text-3);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .ex-row.done .ex-reps { opacity: 0.6; }

  .sets-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .sets { display: flex; gap: 0.45rem; flex-wrap: wrap; }
  .set {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--separator-strong);
    background: transparent;
    color: var(--text-3);
    font-size: 0.7rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.2s cubic-bezier(0.34, 1.3, 0.64, 1);
  }
  .set:active { transform: scale(0.9); }
  .set.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: scale(1.02);
  }
  .ex-row.done .set.done {
    background: var(--success);
    border-color: var(--success);
  }

  .weight-btn {
    flex: 0 0 auto;
    padding: 0.4rem 0.75rem;
    border-radius: 100px;
    background: var(--surface-2);
    color: var(--text-3);
    border: none;
    font-size: 0.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.25rem;
    letter-spacing: -0.01em;
  }
  .weight-btn:active { transform: scale(0.94); }
  .weight-btn.has-weight {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .weight-btn .plus {
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0.7;
  }

  .rest-card {
    padding: 3rem 1.5rem;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    text-align: center;
    margin-top: 0.5rem;
  }
  .rest-card .moon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.6; }
  .rest-card h3 { margin: 0 0 0.35rem; font-size: 1rem; font-weight: 600; }
  .rest-card p { margin: 0; font-size: 0.85rem; color: var(--text-3); line-height: 1.5; }

  .notes-section { margin-top: 1.5rem; }
  .notes-section > h3 {
    font-size: 0.75rem;
    color: var(--text-3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 0.5rem 0.25rem;
  }
  .notes-list {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    padding: 0.9rem 1rem;
    font-size: 0.82rem;
    color: var(--text-2);
    line-height: 1.55;
  }
  .notes-list ul { margin: 0; padding-left: 1.1rem; }
  .notes-list li { margin-bottom: 0.25rem; }
  .notes-list li:last-child { margin-bottom: 0; }
  .notes-list li::marker { color: var(--text-3); }

  .stats-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .stats-card > h3 {
    font-size: 0.72rem;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
    margin: 0 0 0.75rem;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }
  .stat-tile {
    background: var(--surface-2);
    border-radius: var(--radius-md);
    padding: 0.75rem 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .stat-value {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1.1;
  }
  .stat-label {
    font-size: 0.72rem;
    color: var(--text-3);
    font-weight: 500;
  }
  .donut-wrap { display: flex; align-items: center; gap: 1rem; }
  .donut { width: 116px; height: 116px; flex: 0 0 auto; }
  .donut-legend {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 0.4rem;
  }
  .donut-legend-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.5rem; font-size: 0.78rem;
  }
  .donut-legend-label {
    display: flex; align-items: center; gap: 0.4rem;
    color: var(--text-2); font-weight: 500;
  }
  .donut-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .donut-legend-value {
    color: var(--text-3); font-weight: 500;
    font-variant-numeric: tabular-nums; font-size: 0.72rem; white-space: nowrap;
  }
  .stats-empty {
    text-align: center; color: var(--text-3);
    font-size: 0.82rem; padding: 1.5rem 0;
  }

  .card-cta {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    width: 100%;
    padding: 1rem 1.1rem;
    background: linear-gradient(135deg, var(--accent), #5856D6);
    color: #fff;
    border: none;
    border-radius: var(--radius-lg);
    margin-bottom: 1rem;
    text-align: left;
    box-shadow: 0 8px 20px -8px rgba(0, 122, 255, 0.5);
  }
  [data-theme="dark"] .card-cta {
    background: linear-gradient(135deg, var(--accent), #5E5CE6);
    box-shadow: 0 8px 20px -8px rgba(10, 132, 255, 0.4);
  }
  .card-cta:active { transform: scale(0.99); opacity: 0.92; }
  .card-cta-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.2);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .card-cta-icon svg {
    width: 20px; height: 20px;
    stroke: #fff; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .card-cta-text { flex: 1; min-width: 0; }
  .card-cta-title {
    font-size: 0.95rem; font-weight: 600;
    letter-spacing: -0.01em; margin-bottom: 0.15rem;
  }
  .card-cta-sub { font-size: 0.75rem; opacity: 0.85; font-weight: 400; }
  .card-cta-arrow {
    width: 16px; height: 16px;
    stroke: #fff; fill: none; stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round;
    opacity: 0.7;
  }

  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem 0.25rem 1rem; gap: 0.5rem;
  }
  .cal-month { flex: 1; text-align: center; font-size: 1rem; font-weight: 600; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.25rem;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--separator);
    padding: 0.75rem 0.6rem 1rem;
  }
  .cal-header {
    text-align: center; font-size: 0.68rem; font-weight: 500;
    color: var(--text-3); padding: 0.4rem 0;
  }
  .cal-cell {
    aspect-ratio: 1; border-radius: 8px; background: transparent; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 0.82rem; font-weight: 500; color: var(--text);
    position: relative; padding: 0; font-variant-numeric: tabular-nums;
  }
  .cal-cell:active { transform: scale(0.92); }
  .cal-cell.empty { pointer-events: none; }

  function toISO(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fromISO(s) {

  }
  function normalizeToMonday(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = t.getDay();
    if (day === 0) t.setDate(t.getDate() - 6);
    else t.setDate(t.getDate() - (day - 1));
    return t;
  }
  function daysBetween(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }

  function formatDuration(sec) {
    if (!sec && sec !== 0) return "--:--";
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    return m + ":" + String(s).padStart(2, "0");
  }
  function formatDurationLong(sec) {
    if (!sec) return "0 dk";
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + "s " + m + "dk";
    return m + " dk";
  }
  function formatWeight(w) {
    if (w == null) return null;
    if (w === Math.floor(w)) return String(w);
    return w.toFixed(1).replace(/\.0$/, "");
  }
  function formatVolume(kg) {
    if (kg <= 0) return "0";
    if (kg < 1000) return Math.round(kg) + " kg";

  }

  (function migrateStartDate() {

  function getProgramDayForDate(date) {
    if (!state.startDate) return null;
    var start = fromISO(state.startDate);
    var diff = daysBetween(start, date);

    return DAY_SEQUENCE[idx];
  }

  function getSession(dateISO) { return state.sessions[dateISO] || {}; }
  function getExerciseSets(dateISO, exName) {
    var s = getSession(dateISO);

  }
  function getExerciseWeight(dateISO, exName) {
    var s = getSession(dateISO);
    if (!s.weights) return null;
    var v = s.weights[exName];
    return (v == null) ? null : v;
  }
  function ensureSession(dateISO) {
    if (!state.sessions[dateISO]) state.sessions[dateISO] = { sets: {}, weights: {} };
    if (!state.sessions[dateISO].sets) state.sessions[dateISO].sets = {};
    if (!state.sessions[dateISO].weights) state.sessions[dateISO].weights = {};
    return state.sessions[dateISO];
  }
  function toggleSet(dateISO, exName, setIdx, totalSets) {
    pushUndo();
    var s = ensureSession(dateISO);
    if (!s.sets[exName]) s.sets[exName] = new Array(totalSets).fill(false);
    s.sets[exName][setIdx] = !s.sets[exName][setIdx];
    if (s.sets[exName].every(function (v) { return !v; })) delete s.sets[exName];
    save();
  }
  function markAllSets(dateISO, exName, totalSets, value) {
    pushUndo();
    var s = ensureSession(dateISO);
    s.sets[exName] = new Array(totalSets).fill(!!value);
    if (!value) delete s.sets[exName];
    save();
  }
  function setExerciseWeight(dateISO, exName, value) {
    pushUndo();
    var s = ensureSession(dateISO);
    if (value == null) delete s.weights[exName];
    else s.weights[exName] = value;
    save();
  }
  function getDayProgress(dateISO, dayName) {
    var prog = PROGRAM[dayName];
    if (!prog) return { total: 0, done: 0, pct: 0 };
    var total = 0, done = 0;
    prog.ex.forEach(function (ex) {
      total += ex.sets;
      var arr = getExerciseSets(dateISO, ex.name);
      for (var i = 0; i < ex.sets; i++) if (arr[i]) done++;
    });
    return { total: total, done: done, pct: total ? done / total : 0 };
  }

  function calculateStreak() {
    if (!state.startDate) return 0;
    var t = today();
    var start = fromISO(state.startDate);
    var d = new Date(t);
    var todayName = getProgramDayForDate(t);
    var todayISO = toISO(t);
    var startFromToday = false;
    if (todayName === "Dinlenme") startFromToday = true;
    else {
      var s = state.sessions[todayISO];
      if (s && s.sets) {
        for (var k in s.sets) { if (s.sets[k] && s.sets[k].some(Boolean)) { startFromToday = true; break; } }
      }
    }
    if (!startFromToday) d.setDate(d.getDate() - 1);
    var streak = 0;
    var guard = 0;
    while (guard++ < 365) {
      if (d.getTime() < start.getTime()) break;
      var iso = toISO(d);
      var dayName = getProgramDayForDate(d);
      if (dayName === "Dinlenme") { streak++; }
      else {
        var ss = state.sessions[iso];
        var hasAny = false;
        if (ss && ss.sets) {
          for (var k2 in ss.sets) { if (ss.sets[k2] && ss.sets[k2].some(Boolean)) { hasAny = true; break; } }
        }
        if (hasAny) streak++;
        else break;
      }
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function parseAvgReps(repsStr) {
    if (!repsStr) return null;
    var s = String(repsStr).trim();
    var m = s.match(/^(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)$/);
    if (m) return (parseFloat(m[1]) + parseFloat(m[2])) / 2;
    m = s.match(/^(\d+)\s*\+\s*(\d+)$/);
    if (m) return parseInt(m[1], 10) + parseInt(m[2], 10);
    m = s.match(/^(\d+(?:\.\d+)?)$/);
    if (m) return parseFloat(m[1]);
    return null;
  }

  function collectRangeStats(startISO, endISO) {
    var sessions = 0, setsCount = 0, duration = 0, calories = 0, volume = 0;
    var groups = {};
    GROUP_ORDER.forEach(function (g) { groups[g] = 0; });
    for (var iso in state.sessions) {
      if (iso < startISO || iso > endISO) continue;
      var s = state.sessions[iso];
      if (!s || !s.sets) continue;
      var dayName = getProgramDayForDate(fromISO(iso));
      if (!dayName || dayName === "Dinlenme") continue;
      var prog = PROGRAM[dayName];
      if (!prog) continue;
      var hasAny = false;
      prog.ex.forEach(function (ex) {
        var arr = s.sets[ex.name] || [];
        var doneCount = 0;
        for (var i = 0; i < arr.length; i++) if (arr[i]) doneCount++;
        if (doneCount > 0) {
          hasAny = true;
          setsCount += doneCount;
          var grp = getMuscleGroup(ex.name);
          if (groups[grp] !== undefined) groups[grp] += doneCount;
          var w = s.weights && s.weights[ex.name];
          if (w != null) {
            var reps = parseAvgReps(ex.reps);
            if (reps) volume += w * doneCount * reps;
          }
        }
      });
      if (hasAny) sessions++;
      duration += s.duration || 0;
      calories += s.calories || 0;
    }
    return {
      sessions: sessions, sets: setsCount, duration: duration,
      calories: calories, volume: volume, groups: groups
    };
  }

  function getStats(period) {

    if (period === "week") startISO = toISO(normalizeToMonday(now));
    else if (period === "month") startISO = toISO(new Date(now.getFullYear(), now.getMonth(), 1));
    else startISO = "0000-00-00";
    return collectRangeStats(startISO, toISO(now));
  }

        longPressTimer = setTimeout(function () {
          longPressFired = true;
          var allDone = exEl.classList.contains("done");
          markAllSets(dateISO, exName, exDef.sets, !allDone);
          renderWorkout();
          showToast(allDone ? "Setler temizlendi" : "Tüm setler işaretlendi");
          renderHeader();
        }, 550);
      }
      function cancelPress() {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      }
      exEl.addEventListener("touchstart", startPress, { passive: true });
      exEl.addEventListener("touchend", cancelPress);
      exEl.addEventListener("touchmove", cancelPress);
      exEl.addEventListener("touchcancel", cancelPress);
      exEl.addEventListener("mousedown", startPress);
      exEl.addEventListener("mouseup", cancelPress);
      exEl.addEventListener("mouseleave", cancelPress);
    });

    if (isRunning) startTimer();
    else stopTimer();
  }

  function relativeDay(d) {
    var t = today();
    var diff = daysBetween(t, d);
    if (diff === 0) return "Bugün";
    if (diff === -1) return "Dün";
    if (diff === 1) return "Yarın";
    if (diff < -1) return Math.abs(diff) + " gün önce";
    return diff + " gün sonra";
  }

  function renderStatTile(value, label) {

  function renderDonut(groups) {
    var total = 0;
    GROUP_ORDER.forEach(function (g) { total += (groups[g] || 0); });
    if (total === 0) return '<div class="stats-empty">Bu ay henüz veri yok</div>';

    var r = 70, sw = 26;
    var circumference = 2 * Math.PI * r;
    var offset = 0;

    var svg = '<svg viewBox="0 0 200 200" class="donut">';
    svg += '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + sw + '"/>';
    GROUP_ORDER.forEach(function (g) {
      var count = groups[g] || 0;
      if (count === 0) return;
      var fraction = count / total;
      var dash = fraction * circumference;
      svg += '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="' + GROUP_COLORS[g] + '" stroke-width="' + sw + '" stroke-dasharray="' + dash + ' ' + (circumference - dash) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 100 100)"/>';
      offset += dash;
    });
    svg += '</svg>';

    var legend = '<div class="donut-legend">';
    GROUP_ORDER.forEach(function (g) {
      var count = groups[g] || 0;
      var pct = total ? Math.round((count / total) * 100) : 0;
      legend += '<div class="donut-legend-item">';
      legend += '<span class="donut-legend-label"><span class="donut-legend-dot" style="background:' + GROUP_COLORS[g] + '"></span>' + g + '</span>';
      legend += '<span class="donut-legend-value">' + count + ' · ' + pct + '%</span></div>';
    });
    legend += '</div>';
    return '<div class="donut-wrap">' + svg + legend + '</div>';
  }

  function drawTrackedText(ctx, text, x, y, tracking) {
    var widths = [];
    var totalWidth = 0;
    for (var i = 0; i < text.length; i++) {
      var w = ctx.measureText(text[i]).width;
      widths.push(w);
      totalWidth += w + tracking;
    }
    totalWidth -= tracking;
    var startX = x - totalWidth / 2;
    ctx.textAlign = "left";
    for (var j = 0; j < text.length; j++) {
      ctx.fillText(text[j], startX, y);
      startX += widths[j] + tracking;
    }
  }

  function roundedRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function formatRangeForCard(startISO, endISO) {
    var s = fromISO(startISO);
    var e = fromISO(endISO);
    var sameMonth = (s.getMonth() === e.getMonth()) && (s.getFullYear() === e.getFullYear());
    var nowYear = new Date().getFullYear();
    var line1, line2;

    if (sameMonth) {
      line1 = s.getDate() + " — " + e.getDate() + " " + MONTHS_TR[e.getMonth()];
      if (e.getFullYear() !== nowYear) line1 += " " + e.getFullYear();
      line2 = null;
    } else {
      line1 = s.getDate() + " " + MONTHS_TR[s.getMonth()];
      line2 = "— " + e.getDate() + " " + MONTHS_TR[e.getMonth()];
      if (e.getFullYear() !== nowYear) line2 += " " + e.getFullYear();
    }

    var days = Math.round((e.getTime() - s.getTime()) / 86400000) + 1;
    return { line1: line1, line2: line2, daysCount: days };
  }

  function drawCard(canvas, startISO, endISO) {
    var W = 1080, H = 1920;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d");

    var isDark = document.documentElement.getAttribute("data-theme") === "dark";

    var bgTop    = isDark ? "#0F0F14" : "#FFFFFF";
    var bgBottom = isDark ? "#000000" : "#F2F2F7";
    var text     = isDark ? "#FFFFFF" : "#000000";
    var text2    = isDark ? "#C7C7CC" : "#3C3C43";
    var text3    = isDark ? "#8E8E93" : "#8E8E93";
    var sep      = isDark ? "rgba(255,255,255,0.10)" : "rgba(60,60,67,0.12)";
    var accent   = isDark ? "#0A84FF" : "#007AFF";
    var success  = isDark ? "#30D158" : "#34C759";
    var warm     = isDark ? "#FF9F0A" : "#FF9500";

    var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, bgTop);
    bgGrad.addColorStop(1, bgBottom);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    var glow = ctx.createRadialGradient(W / 2, -200, 0, W / 2, -200, 1300);
    glow.addColorStop(0, isDark ? "rgba(10,132,255,0.30)" : "rgba(0,122,255,0.12)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, 1200);

    var glow2 = ctx.createRadialGradient(W / 2, H + 300, 0, W / 2, H + 300, 1000);
    glow2.addColorStop(0, isDark ? "rgba(94,92,230,0.20)" : "rgba(94,92,230,0.08)");
    glow2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow2;
    ctx.fillRect(0, H - 1000, W, 1000);

    var pad = 90;
    var stats = collectRangeStats(startISO, endISO);
    var rangeInfo = formatRangeForCard(startISO, endISO);

    ctx.fillStyle = accent;
    ctx.fillRect(pad, 90, 100, 8);

    ctx.fillStyle = text3;
    ctx.font = "700 22px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    drawTrackedText(ctx, "ANTRENMAN ÖZETİ", pad + 340, 180, 7);

    var line1Y = 300;
    ctx.fillStyle = text;
    ctx.font = "800 76px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(rangeInfo.line1, pad, line1Y);

    var daysY;
    if (rangeInfo.line2) {
      var line2Y = line1Y + 92;
      ctx.fillText(rangeInfo.line2, pad, line2Y);
      daysY = line2Y + 60;
    } else {
      daysY = line1Y + 60;
    }

    ctx.fillStyle = text3;
    ctx.font = "500 28px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.fillText(rangeInfo.daysCount + " gün", pad, daysY);

    var divY1 = daysY + 40;

    ctx.fillStyle = sep;
    ctx.fillRect(pad, divY1, W - pad * 2, 2);

    var tileTopY = divY1 + 80;
    var tiles = [
      { label: "ANTRENMAN", value: String(stats.sessions) },
      { label: "SET", value: String(stats.sets) },
      { label: "SÜRE", value: formatDurationLong(stats.duration) }
    ];
    if (stats.calories > 0) {
      tiles.push({ label: "KALORİ", value: stats.calories.toLocaleString("tr-TR"), unit: "kcal" });
    }

    var tileCols = tiles.length;
    var tileColW = (W - pad * 2) / tileCols;

    tiles.forEach(function (tile, i) {
      var cx = pad + tileColW * i + tileColW / 2;

      ctx.fillStyle = text3;
      ctx.font = "700 18px -apple-system, system-ui, 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      drawTrackedText(ctx, tile.label, cx, tileTopY + 20, 4);

      ctx.fillStyle = text;
      ctx.font = "800 56px -apple-system, system-ui, 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(tile.value, cx, tileTopY + 100);

      if (tile.unit) {
        ctx.fillStyle = text3;
        ctx.font = "500 18px -apple-system, system-ui, 'Segoe UI', sans-serif";
        ctx.fillText(tile.unit, cx, tileTopY + 130);
      }
    });

    var divY2 = tileTopY + 170;

    ctx.fillStyle = sep;
    ctx.fillRect(pad, divY2, W - pad * 2, 2);

    var mgLabelY = divY2 + 65;
    ctx.fillStyle = text3;
    ctx.font = "700 22px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    drawTrackedText(ctx, "KAS GRUBU DAĞILIMI", pad, mgLabelY, 5);

    var groupTotal = 0;
    var maxGroup = 0;
    GROUP_ORDER.forEach(function (g) {
      var v = stats.groups[g] || 0;
      groupTotal += v;
      if (v > maxGroup) maxGroup = v;
    });

    var barAreaY = mgLabelY + 50;
    var rowH = 62;
    var barH = 12;
    var labelW = 240;
    var barMaxW = W - pad * 2 - labelW - 200;

    GROUP_ORDER.forEach(function (g, i) {
      var count = stats.groups[g] || 0;
      var pct = groupTotal > 0 ? Math.round((count / groupTotal) * 100) : 0;
      var y = barAreaY + i * rowH;
      var centerY = y + barH / 2;

      ctx.fillStyle = GROUP_COLORS[g];
      ctx.beginPath();
      ctx.arc(pad + 10, centerY, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = text;
      ctx.font = "600 28px -apple-system, system-ui, 'Segoe UI', sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(g, pad + 32, centerY);

      var barX = pad + labelW;
      ctx.fillStyle = isDark ? "rgba(255,255,255,0.06)" : "rgba(60,60,67,0.08)";
      roundedRect(ctx, barX, y, barMaxW, barH, barH / 2);
      ctx.fill();

      if (count > 0 && maxGroup > 0) {
        var fillW = Math.max((count / maxGroup) * barMaxW, barH);
        ctx.fillStyle = GROUP_COLORS[g];
        roundedRect(ctx, barX, y, fillW, barH, barH / 2);
        ctx.fill();
      }

      ctx.fillStyle = text;
      ctx.font = "700 24px -apple-system, system-ui, 'Segoe UI', sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(count + "  ·  " + pct + "%", W - pad, centerY);
    });

    var divY3 = barAreaY + 5 * rowH + 15;

    ctx.fillStyle = sep;
    ctx.fillRect(pad, divY3, W - pad * 2, 2);

    var gelLabelY = divY3 + 65;
    ctx.fillStyle = text3;
    ctx.font = "700 22px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    drawTrackedText(ctx, "GELİŞİM", pad, gelLabelY, 5);

    var sDate = fromISO(startISO);
    var eDate = fromISO(endISO);
    var rangeDays = daysBetween(sDate, eDate) + 1;
    var programDaysInRange = 0;
    for (var i = 0; i < rangeDays; i++) {
      var dd = new Date(sDate.getTime() + i * 86400000);
      var dn = getProgramDayForDate(dd);
      if (dn && dn !== "Dinlenme") programDaysInRange++;
    }
    var consistency = programDaysInRange > 0 ? Math.round((stats.sessions / programDaysInRange) * 100) : 0;
    if (consistency > 100) consistency = 100;
    var avgSec = stats.sessions > 0 ? Math.round(stats.duration / stats.sessions) : 0;
    var strengthPct = Math.round((stats.sets / 25) * 10) / 10;

    var hasVolume = stats.volume > 0;
    var colCount = hasVolume ? 4 : 3;
    var gelColW = (W - pad * 2) / colCount;
    var gelValueY = gelLabelY + 100;
    var gelSubY = gelValueY + 40;

    var cx1 = pad + gelColW * 0.5;
    ctx.fillStyle = success;
    ctx.font = "800 56px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("+" + strengthPct + "%", cx1, gelValueY);
    ctx.fillStyle = text3;
    ctx.font = "500 20px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.fillText("tahmini güç", cx1, gelSubY);

    var cx2 = pad + gelColW * 1.5;
    ctx.fillStyle = text;
    ctx.font = "800 56px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.fillText(consistency + "%", cx2, gelValueY);
    ctx.fillStyle = text3;
    ctx.font = "500 20px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.fillText("konsistlik", cx2, gelSubY);

    var cx3 = pad + gelColW * 2.5;
    ctx.fillStyle = text;
    ctx.font = "800 56px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.fillText(formatDurationLong(avgSec), cx3, gelValueY);
    ctx.fillStyle = text3;
    ctx.font = "500 20px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.fillText("ort. süre", cx3, gelSubY);

    if (hasVolume) {
      var cx4 = pad + gelColW * 3.5;
      ctx.fillStyle = accent;
      ctx.font = "800 56px -apple-system, system-ui, 'Segoe UI', sans-serif";
      ctx.fillText(formatVolume(stats.volume), cx4, gelValueY);
      ctx.fillStyle = text3;
      ctx.font = "500 20px -apple-system, system-ui, 'Segoe UI', sans-serif";
      ctx.fillText("hacim", cx4, gelSubY);
    }

    var streak = calculateStreak();
    if (streak > 0) {
      var pillText = "🔥  " + streak + " GÜN STREAK";
      ctx.font = "700 30px -apple-system, system-ui, 'Segoe UI', sans-serif";
      var pw = ctx.measureText(pillText).width;
      var pillW = pw + 90;
      var pillH = 66;
      var pillX = W / 2 - pillW / 2;
      var pillY = 1500;

      ctx.fillStyle = isDark ? "rgba(255,159,10,0.15)" : "rgba(255,149,0,0.12)";
      roundedRect(ctx, pillX, pillY, pillW, pillH, pillH / 2);
      ctx.fill();

      ctx.fillStyle = warm;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(pillText, W / 2, pillY + pillH / 2 + 2);
    }

    var sigY = H - 140;
    ctx.fillStyle = sep;
    ctx.fillRect(W / 2 - 50, sigY - 70, 100, 3);

    ctx.fillStyle = text;
    ctx.font = "800 52px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(state.name || "Antrenman", W / 2, sigY);

    ctx.fillStyle = text3;
    ctx.font = "500 20px -apple-system, system-ui, 'Segoe UI', sans-serif";
    ctx.fillText("antrenman günlüğü", W / 2, sigY + 42);
  }

  function renderCalendar() {
    var y = calendarMonth.getFullYear();
    var m = calendarMonth.getMonth();
    $("#calMonthLabel").textContent = MONTHS_TR[m] + " " + y;
    var html = "";
    WEEK_HEADERS.forEach(function (h) { html += '<div class="cal-header">' + h + '</div>'; });
    var first = new Date(y, m, 1);
    var startWeekday = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < startWeekday; i++) html += '<div class="cal-cell empty"></div>';
    var t = today();
    for (var d = 1; d <= daysInMonth; d++) {
      var date = new Date(y, m, d);
      var iso = toISO(date);
      var dayName = getProgramDayForDate(date);
      var isToday = toISO(t) === iso;
      var isFuture = date.getTime() > t.getTime();
      var cls = "cal-cell";
      if (isToday) cls += " today";
      if (isFuture) cls += " future";
      var dot = '';
      if (dayName && dayName !== "Dinlenme") {
        var p = getDayProgress(iso, dayName);
        if (p.done === p.total && p.total > 0) cls += " complete";
        else if (p.done > 0) cls += " partial";
        dot = '<span class="cal-dot"></span>';
      }
      html += '<button class="' + cls + '" data-date="' + iso + '">' + d + dot + '</button>';
    }
    calendarGrid.innerHTML = html;
    calendarGrid.querySelectorAll(".cal-cell[data-date]").forEach(function (cell) {
      cell.addEventListener("click", function () {
        selectedDate = fromISO(cell.dataset.date);
        currentView = "workout";
        document.querySelectorAll(".segmented button").forEach(function (b) { b.classList.toggle("active", b.dataset.view === "workout"); });
        document.querySelectorAll(".view").forEach(function (v) { v.classList.toggle("active", v.id === "view-workout"); });
        renderWorkout();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function renderSettings() {
    var html = '';

    var daysSinceBackup = null;
    if (state.lastBackup) daysSinceBackup = daysBetween(fromISO(state.lastBackup), today());
    if (!state.lastBackup) {
      html += '<div class="warn-banner">Hiç yedek almadın. Aşağıdan yedekleyebilirsin.</div>';
    } else if (daysSinceBackup >= 30) {
      html += '<div class="warn-banner danger">' + daysSinceBackup + ' gündür yedek almadın.</div>';
    } else if (daysSinceBackup >= 7) {
      html += '<div class="warn-banner">Son yedek ' + daysSinceBackup + ' gün önce.</div>';
    }

    html += '<div class="settings-group-title">Profil</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div class="label-wrap"><span>İsim Soyisim</span></div>';
    html += '<input type="text" id="settingsName" value="' + escapeHtml(state.name || "") + '"></div>';
    html += '<div class="settings-row"><div class="label-wrap"><span>İlk Pazartesi</span><span class="sub">Seçtiğin gün o haftanın Pzt\'sine ayarlanır</span></div>';
    html += '<input type="date" id="settingsDate" value="' + (state.startDate || toISO(normalizeToMonday(today()))) + '"></div>';
    html += '<button class="settings-row primary" id="saveProfileBtn"><span>Kaydet</span>';
    html += '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
    html += '</div>';

    html += '<div class="settings-group-title">Yedekleme</div>';
    html += '<div class="settings-group">';
    html += '<button class="settings-row primary" id="backupBtn">';
    html += '<div class="label-wrap"><span>Yedekle</span><span class="sub">JSON dosyası olarak indir</span></div>';
    html += '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>';
    html += '<button class="settings-row primary" id="restoreBtn">';
    html += '<div class="label-wrap"><span>Geri Yükle</span><span class="sub">Yedek dosyasından yükle</span></div>';
    html += '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>';
    html += '</div>';

    var totalSessions = 0;
    for (var k in state.sessions) {
      var s = state.sessions[k];
      if (s && s.sets) {
        for (var k2 in s.sets) { if (s.sets[k2] && s.sets[k2].some(Boolean)) { totalSessions++; break; } }
      }
    }
    html += '<div class="settings-group-title">Bilgi</div>';
    html += '<div class="settings-group">';
    html += '<div class="info-row"><span>Toplam antrenman</span><span class="value strong">' + totalSessions + '</span></div>';
    html += '<div class="info-row"><span>Streak</span><span class="value fire">🔥 ' + calculateStreak() + ' gün</span></div>';
    if (state.lastBackup) {
      html += '<div class="info-row"><span>Son yedek</span><span class="value">' + state.lastBackup + '</span></div>';
    }
    html += '</div>';

    html += '<div class="settings-group-title">Tehlikeli Bölge</div>';
    html += '<div class="settings-group">';
    html += '<button class="settings-row danger" id="resetAllBtn"><span>Tüm verileri sıfırla</span>';
    html += '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
    html += '</div>';

    settingsContent.innerHTML = html;

    $("#saveProfileBtn").addEventListener("click", function () {
      var n = $("#settingsName").value.trim();
      var d = $("#settingsDate").value;
      if (!n || !d) { showToast("İsim ve tarih gerekli"); return; }
      state.name = n;
      state.startDate = toISO(normalizeToMonday(fromISO(d)));
      save();
      renderHeader();
      showToast("Kaydedildi");
    });

    $("#backupBtn").addEventListener("click", function () {
      try {
        var data = JSON.stringify(state, null, 2);
        var blob = new Blob([data], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "antrenman-yedek-" + toISO(today()) + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        state.lastBackup = toISO(today());
        save();
        showToast("Yedek indirildi");
        renderSettings();
      } catch (e) { showToast("Yedek alınamadı"); }
    });

    $("#restoreBtn").addEventListener("click", function () {
      var input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json,.json";
      input.addEventListener("change", function () {
        var file = input.files && input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            if (!parsed || typeof parsed !== "object") throw new Error("invalid");
            if (!confirm("Mevcut verilerin yedekle değiştirilecek. Devam edilsin mi?")) return;
            state = Object.assign({ name: "", startDate: null, sessions: {}, lastBackup: null }, parsed);
            if (!state.sessions) state.sessions = {};
            if (state.startDate) {
              var dd = fromISO(state.startDate);
              if (dd.getDay() !== 1) state.startDate = toISO(normalizeToMonday(dd));
            }
            save();
            renderHeader();
            renderSettings();
            if (currentView === "workout") renderWorkout();
            if (currentView === "calendar") renderCalendar();
            if (currentView === "stats") renderStats();
            showToast("Yedek geri yüklendi");
          } catch (e) { showToast("Dosya okunamadı"); }
        };
        reader.readAsText(file);
      });
      input.click();
    });

    $("#resetAllBtn").addEventListener("click", function () {
      if (!confirm("Tüm veriler silinecek. Emin misin?")) return;
      if (!confirm("Son bir kez daha: Bu işlem geri alınamaz. Silinsin mi?")) return;
      state = { name: "", startDate: null, sessions: {}, lastBackup: null };
      save();
      undoStack = [];
      renderHeader();
      renderSettings();
      renderWorkout();
      renderCalendar();
      renderStats();
      showToast("Tüm veriler silindi");
    });
  }

  function checkCelebration(dateISO, dayName) {
    var p = getDayProgress(dateISO, dayName);
    if (p.total > 0 && p.done === p.total) {
      if (state.sessions[dateISO] && state.sessions[dateISO].__celebrated) return;
      ensureSession(dateISO).__celebrated = true;
      save();
      celebrate(dayName);
    }
  }
  function celebrate(dayName) {
    var styles = getComputedStyle(document.documentElement);
    var colors = [
      styles.getPropertyValue("--accent").trim() || "#007AFF",
      styles.getPropertyValue("--success").trim() || "#34C759",
      styles.getPropertyValue("--focus").trim() || "#FFCC00"
    ];
    for (var i = 0; i < 30; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.3) + "s";
      piece.style.animationDuration = (1.2 + Math.random() * 0.8) + "s";
      var size = (4 + Math.random() * 4) + "px";
      piece.style.width = size;
      piece.style.height = size;
      celebration.appendChild(piece);
      (function (p) {
        setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 2500);
      })(piece);
    }
    showToast("🎉 " + dayName + " tamamlandı!");
  }

  function render() {
    if (!state.startDate || !state.name) return;
    renderHeader();
    renderWorkout();
    if (currentView === "calendar") renderCalendar();
    if (currentView === "stats") renderStats();
    if (currentView === "settings") renderSettings();
  }

  applyTheme(getInitialTheme());

  initOnboarding();
  if (state.startDate && state.name) render();
})();
</script>
</body>
</html>
